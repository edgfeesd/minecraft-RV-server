<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KingK Minecraft Panel</title><style>body{font-family:system-ui;background:#10131a;color:#eee;max-width:1100px;margin:auto;padding:24px}section{background:#191e28;border:1px solid #303846;border-radius:16px;padding:18px;margin:12px 0}button,input,select,textarea{padding:10px;border-radius:9px;border:1px solid #444;background:#0e1117;color:#fff;margin:4px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}pre{white-space:pre-wrap;max-height:420px;overflow:auto;background:#080a0e;padding:12px;border-radius:10px}</style><body><h1>🎮 KingK Minecraft</h1><section id="login"><input id="pass" type="password" placeholder="رمز ادمین"><button onclick="login()">ورود</button></section><main id="app" hidden><section><button onclick="act('start')">▶ Start</button><button onclick="act('stop')">■ Stop</button><button onclick="act('restart')">↻ Restart</button><button onclick="load()">⟳ Refresh</button></section><div class="grid"><section><h3>Server</h3><pre id="info"></pre></section><section><h3>Railway</h3><pre id="rail"></pre></section></div><section><h3>Command</h3><input id="cmd" style="width:70%" placeholder="say Hello"><button onclick="command()">Send</button></section><section><h3>Console</h3><pre id="logs"></pre></section><section><h3>Server Settings</h3><select id="type"><option>PAPER</option><option>FABRIC</option><option>VANILLA</option></select><input id="ver" value="1.21.1"><input id="ram" value="2G"><button onclick="spec()">Apply & Restart</button></section></main><script>let csrf='';async function api(u,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json',...(csrf?{'x-csrf-token':csrf}:{})};let r=await fetch(u,o),x=await r.json().catch(()=>({}));if(r.status===401){loginBox();throw Error('login')}if(!r.ok)throw Error(x.error||r.status);return x}async function login(){let x=await api('/api/login',{method:'POST',body:JSON.stringify({password:document.querySelector('#pass').value})});csrf=x.csrf;document.querySelector('#login').hidden=true;document.querySelector('#app').hidden=false;load()}async function act(n){await api('/api/minecraft/'+n,{method:'POST'});load()}async function command(){await api('/api/minecraft/command',{method:'POST',body:JSON.stringify({command:cmd.value})});cmd.value='';load()}async function spec(){await api('/api/minecraft/spec',{method:'POST',body:JSON.stringify({type:type.value,version:ver.value,memory:ram.value})});load()}async function load(){try{let x=await api('/api/dashboard');info.textContent=JSON.stringify(x.minecraft,null,2);rail.textContent=JSON.stringify(x.railway||{},null,2);logs.textContent=(await api('/api/minecraft/logs')).logs.map(x=>x.line).join('\n')}catch(e){console.error(e)}}function loginBox(){document.querySelector('#login').hidden=false;document.querySelector('#app').hidden=true}fetch('/api/me').then(r=>r.json()).then(x=>{if(x.authenticated){csrf=x.csrf;loginBox();document.querySelector('#login').hidden=true;document.querySelector('#app').hidden=false;load()}})</script></body></html>
